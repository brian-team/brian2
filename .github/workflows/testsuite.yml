name: TestSuite

on:
  # Only run when source code is affected
  push:
    paths:
      - 'brian2/**'
      - 'setup.*'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/testsuite.yml'
  pull_request:
      paths:
      - 'brian2/**'
      - 'setup.*'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/testsuite.yml'
  schedule:  # Also run regularly (dependency updates, Python version changed, etc.)
    - cron: '15 22 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  get_python_versions:
    name: "Determine Python versions"
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      min-python: ${{ steps.nep29.outputs.min-python }}
      max-python: ${{ steps.nep29.outputs.max-python }}
    steps:
      - name: "calculate versions according to SPEC-0"
        id: nep29
        uses: mstimberg/github-calc-nep29@1f825dcb1a90ced306e498cbd8584ef61af41423 # v0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Match SPEC-0
          deprecate-python-after: 36
          min-python-releases: 0

  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6

  testing:
    needs: [get_python_versions, prek]
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os.image }} (standalone: ${{ matrix.standalone }}, 32bit: ${{ matrix.float_dtype_32 }})"
    runs-on: ${{ matrix.os.image }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            #{ image: ubuntu-24.04, triplet: x64-linux },
            # { image: windows-2022, triplet: x64-windows },
            { image: windows-2022, triplet: x64-mingw-static, compiler: mingw },
            #{ image: macos-15-intel, triplet: x64-osx },
            #{ image: macos-latest, triplet: arm64-osx },
          ]
        standalone: [false]
        float_dtype_32: [false, true]
        python-version: ["${{ needs.get_python_versions.outputs.max-python }}"]

    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch tags from main respository
        run: |
          git remote add upstream https://github.com/brian-team/brian2 && \
          git fetch --tags --force upstream
      - name: Install GSL
        uses: johnwason/vcpkg-action@04c68c847bf5196ecaa72331ecf51208583916ef # v8.0.0
        id: vcpkg
        with:
          pkgs: gsl
          triplet: ${{ matrix.os.triplet }}
          cache-key: gsl-${{ matrix.os.triplet }}
          revision: master
          token: ${{ github.token }}
      - name: Set GSL preference for vcpkg
        shell: bash
        run: |
          mkdir ~/.brian/
          # Replaces backslashes with forward slashes
          echo "GSL.directory=\"${{ github.workspace }}\\vcpkg\\installed\${{ matrix.os.triplet }}\\include"\" | tr '\\' '/' > ~/.brian/user_preferences
          cat ~/.brian/user_preferences
      - name: Install Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: "pip"
          python-version: ${{ matrix.python-version }}
      - name: Install mingw
        id: mingw
        if: ${{ matrix.os.compiler == 'mingw' }}
        uses: egor-tensin/setup-mingw@41b837e47d7f85214629d255b9c4bc3fcbe9fd63 # v3.0
      - name: Set mingw compiler on Windows
        id: mingw-pref
        if: ${{ matrix.os.compiler == 'mingw' }}
        run: |
          gcc --version
          g++ --version
          echo "codegen.cpp.compiler = \"mingw32\" " >> ~/.brian/user_preferences
      - name: Install Brian2 and dependencies
        env:
          PYTHON_BINARY: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON_BINARY" -m pip install .[test]

      - name: Determine Cython cache dir
        id: cython-cache
        run: |
          cd  $GITHUB_WORKSPACE/.. # move out of the workspace to avoid direct import
          CACHE_DIR=$("$PYTHON_BINARY" -c 'from brian2.codegen.runtime.cython_rt.extension_manager import get_cython_cache_dir; print(get_cython_cache_dir())')
          echo "Cython cache dir: $CACHE_DIR"
          echo "cachedir=$CACHE_DIR" >> "$GITHUB_OUTPUT"
        env:
          PYTHON_BINARY: ${{ steps.python.outputs.python-path }}

      - name: restore Cython cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ ! matrix.standalone }}
        with:
          key: cython-extensions-${{ matrix.os.image }}-${{ matrix.os.compiler || 'default' }}-${{ runner.arch }}-${{ matrix.python-version }}-32bit-${{ matrix.float_dtype_32 }}
          path: ${{ steps.cython-cache.outputs.cachedir }}

      - name: Run Tests
        run: |
          cd "$RUNNER_TEMP"
          if "$PYTHON_BINARY" "$GITHUB_WORKSPACE/$SCRIPT_NAME"; then
            cp coverage.xml "$GITHUB_WORKSPACE/"
          else
            test_status=$?
            if [[ "${{ matrix.os.compiler }}" == "mingw" && "${{ matrix.standalone }}" == "false" ]]; then
              echo "Full suite failed; rerunning GSL tests uncaptured for native crash diagnostics"
              "$PYTHON_BINARY" -X faulthandler -c '
          import os
          import pytest
          import brian2
          from brian2.core.preferences import prefs
          from brian2.tests import PreferencePlugin

          package_dir = os.path.dirname(brian2.__file__)
          tests_dir = os.path.join(package_dir, "tests")
          args = [
              "-s", "-vv",
              "-c", os.path.join(tests_dir, "pytest.ini"),
              "--confcutdir", package_dir,
              "--pyargs", "brian2.tests.test_GSL",
          ]
          raise SystemExit(pytest.main(args, plugins=[PreferencePlugin(prefs)]))
                ' || true
            fi
            exit "$test_status"
          fi
        env:
          SCRIPT_NAME: dev/continuous-integration/run_test_suite.py
          SPHINX_DIR: ${{ github.workspace }}/docs_sphinx
          AGENT_OS: ${{runner.os}}
          STANDALONE: ${{ matrix.standalone }}
          FLOAT_DTYPE_32: ${{ matrix.float_dtype_32 }}
          PYTHON_BINARY: ${{ steps.python.outputs.python-path }}
          DO_NOT_RESET_PREFERENCES: true # Make sure that GSL setting is used
      - name: Send coverage to Coveralls (parallel)
        if: ${{ startsWith(matrix.os.image, 'ubuntu-') && matrix.python-version == needs.get_python_versions.outputs.max-python }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel: true
          flag-name: run ${{ join(matrix.*, ' - ') }}

  coveralls:
    name: Indicate completion to coveralls.io
    needs: testing
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel-finished: true
